plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.bluelockmod'
version = '0.2.0-alpha'

base { archivesName = 'blue-lock-mod' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { bluelockmod { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'bluelockmod' }
        server { property 'forge.enabledGameTestNamespaces', 'bluelockmod' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'bluelockmod' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', 'bluelockmod', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.26'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jar { manifest { attributes(['Specification-Title': 'Blue Lock Mod', 'Specification-Vendor': 'BlueLockMod', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version]) } }

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { name = 'local'; url = layout.buildDirectory.dir('repo') } }
}
